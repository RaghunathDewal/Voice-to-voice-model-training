# Faster, cheaper variant for a first run on a free Kaggle/Colab GPU (T4/P100, 16 GB).
# Same architecture, smaller pieces. Use it to prove the pipeline end-to-end,
# then switch to default.yaml.
base: default.yaml

thinker:
  model: Qwen/Qwen3-0.6B

adapter:
  d_model: 512
  n_layers: 3
  n_heads: 8

talker:
  d_model: 512
  n_layers: 6
  n_heads: 8
  depth_d_model: 384
  depth_layers: 4
  depth_heads: 6

train_speech_llm:
  max_steps: 5000
  eval_every: 500
  save_every: 500

train_talker:
  max_steps: 20000
  eval_every: 1000
  save_every: 1000
