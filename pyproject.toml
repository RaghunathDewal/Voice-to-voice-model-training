[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "s2s"
version = "0.1.0"
description = "English turn-based speech-to-speech LLM with tool calling: Parakeet/Mimi -> adapter -> Qwen3 -> Talker -> Mimi"
license = {file = "LICENSE"}
authors = [{name = "Raghunath Singh Dewal"}]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.51",
    "peft>=0.11",
    "accelerate>=0.30",
    "numpy",
    "scipy",
    "soundfile",
    "pyyaml",
    "jiwer",
    "silero-vad>=5.1",      # voice activity detection for live turn-taking (MIT, model bundled, CPU)
    "tqdm",
]

[project.optional-dependencies]
tts = ["kokoro>=0.9", "misaki[en]"]
demo = ["gradio>=4", "fastapi", "uvicorn", "websockets"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["s2s*"]

[tool.setuptools.package-data]
"s2s.cli" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
